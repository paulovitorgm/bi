{% extends 'partials/_base.html' %}

{% load custom_filters %}

{% block content %}
<div class="table-responsive">
    <table class="table table-striped table-hover ">
        <thead>
            <tr>
            <th>Matrícula</th>
            <th>Nome</th>
            <th colspan="3">Ação</th>
            </tr>
        </thead>
        <tbody>
            {% for pessoa in pessoas %}
                <tr>
                    <th>{{ pessoa.matricula }}</th>
                    <td>{{ pessoa.nome }}</td>
                     <td colspan="3">
                        <a href="{% url 'editar-pessoa' pessoa.matricula %}">
                            <button type="button" class="btn btn-warning">Editar</button></a>
                        <a href="{% url 'deletar-pessoa'  pessoa.matricula %}">
                            <button type="button" class="btn btn-danger">Excluir</button></a>

                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="10"> Nenhum processo encontrado.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
