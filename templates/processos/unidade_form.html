{% extends 'partials/_base.html' %}

{% block content %}
<div class="container my-4" style="max-width: 650px;">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h3 class="card-title mb-4 border-bottom pb-2">
        {% if form.instance.pk %}Editar Unidade{% else %}Nova Unidade{% endif %}
      </h3>

      <form method="post" class="needs-validation" novalidate>
        {% csrf_token %}

        <div class="row">
          {% for field in form %}
            <div class="col-12 mb-3">
              <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
              {{ field }}
              {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors|strip_tags }}</div>
              {% endif %}
            </div>
          {% endfor %}
        </div>

        <div class="d-flex justify-content-end gap-2 pt-3 border-top mt-3">
          <a href="{% url 'unidade_list' %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-building-add me-1"></i> Salvar Unidade
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
