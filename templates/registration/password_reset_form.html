{% extends 'partials/_base.html' %}
{% block title %}
    Recuperar senha
{% endblock %}
{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-2">Recuperar senha</h1>
                        <p class="text-body-secondary">Informe seu e-mail para receber as instruções.</p>
                        <form method="post">
                            {% csrf_token %}
                            {{ form.email.errors }}
                            <label for="{{ form.email.id_for_label }}" class="form-label">E-mail</label>
                            <input type="email" name="{{ form.email.html_name }}" id="{{ form.email.id_for_label }}"
                                   class="form-control mb-3" required autofocus>
                            <button type="submit" class="btn btn-primary w-100">Enviar instruções</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{% url 'login' %}">Voltar para o login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
