server {
    listen 80;
    server_name servidor-bi.interno;

    # Em produção com HTTPS, redirecione esta porta para 443 e acrescente a
    # configuração do certificado neste bloco.
    location /static/ {
        # Ajuste este caminho para a pasta do projeto no servidor.
        alias /opt/base-dados-bi/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
