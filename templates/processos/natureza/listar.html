{% extends "partials/_base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Naturezas</h2>

        <a href="{% url 'natureza_create' %}" class="btn btn-success">
            Nova Natureza
        </a>

    </div>

    <table class="table table-striped">

        <thead>
            <tr>
                <th>Nome</th>
                <th width="180">Ações</th>
            </tr>
        </thead>

        <tbody>

        {% for natureza in naturezas %}

            <tr>

                <td>{{ natureza.nome }}</td>

                <td>

                    <a href="{% url 'natureza_update' natureza.pk %}"
                       class="btn btn-warning btn-sm">
                        Editar
                    </a>

                    <a href="{% url 'natureza_delete' natureza.pk %}"
                       class="btn btn-danger btn-sm">
                        Excluir
                    </a>

                </td>

            </tr>

        {% empty %}

            <tr>
                <td colspan="2">
                    Nenhuma natureza cadastrada.
                </td>
            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
