{% extends "partials/_base.html" %}

{% block content %}

<div class="container mt-4">
    <h3>Deseja realmente excluir este processo?</h3>
    <hr>
    <p><strong>Matricula:</strong> {{ pessoa.matricula }}</p>
    <p><strong>Nome:</strong> {{ pessoa.nome }}</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger">Excluir</button>
        <a href="{% url 'listar-pessoas' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

{% endblock %}
