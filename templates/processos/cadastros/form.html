{% extends "partials/_base.html" %}
{% block content %}
    <div class="container py-4 form-page"><div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h3 mb-0">{{ titulo }}</h1><a href="{% url listar_url %}" class="btn btn-outline-secondary">Voltar à lista</a></div><form method="post" class="card shadow-sm"><div class="card-body p-4">{% csrf_token %}{% for field in form %}<div class="mb-3">{{ field.label_tag }}{{ field }}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>{% endfor %}<div class="d-flex justify-content-end gap-2"><a href="{% url listar_url %}" class="btn btn-light">Cancelar</a><button class="btn btn-primary">Salvar</button></div></div></form></div>
{% endblock %}
