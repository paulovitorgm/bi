{% extends "partials/_base.html" %}
{% block content %}
    <div class="container mt-4">
        <h3>
            Deseja excluir a modalidade:
            <strong>{{ object.nome }}</strong>?
        </h3>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger">Confirmar</button>
            <a href="{% url 'modalidade_listar' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
{% endblock %}
