{% extends "partials/_base.html" %}
{% block content %}
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">Confirmar Exclusão</div>
            <div class="card-body">
                <p>
                    Deseja realmente excluir o processo
                    <strong>{{ object.processo }}</strong>?
                </p>
                <form method="post">
                    {% csrf_token %}
                    <button class="btn btn-danger">Excluir</button>
                    <a href="{% url 'processo_listar' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
