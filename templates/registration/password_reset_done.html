{% extends 'partials/_base.html' %}
{% block title %}
    E-mail enviado
{% endblock %}
{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 text-center">
                        <h1 class="h3 mb-3">Verifique seu e-mail</h1>
                        <p>Se houver uma conta associada ao endereço informado, enviaremos instruções para criar uma nova senha.</p>
                        <a href="{% url 'login' %}" class="btn btn-primary">Voltar para o login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
