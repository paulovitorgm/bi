{% extends "partials/_base.html" %}
{% block content %}
    <div class="container mt-4">
        <div class="d-flex justify-content-between mb-3">
            <h2>Unidades</h2>
            <a href="{% url 'unidade_criar' %}" class="btn btn-primary">Nova Unidade</a>
        </div>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Sigla</th>
                    <th>Nome</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for unidade in unidades %}
                    <tr>
                        <td>{{ unidade.sigla }}</td>
                        <td>{{ unidade.nome }}</td>
                        <td>
                            <a href="{% url 'unidade_editar' unidade.pk %}"
                               class="btn btn-sm btn-warning">Editar</a>
                            <a href="{% url 'unidade_delete' unidade.pk %}"
                               class="btn btn-sm btn-danger">Excluir</a>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="3">Nenhuma unidade cadastrada.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
